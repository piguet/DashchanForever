name: Build APK

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: gradle

      - name: Install Android NDK 21.4.7075529
        run: echo "y" | sudo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;21.4.7075529"

      - name: Install libncurses5
        run: sudo apt-get update && sudo apt-get install -y libncurses5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT} ./gradlew :assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Dashchan-debug-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
